name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build -p ide-app --release

      - name: Self-check the release binary
        run: .\target\release\ide-app.exe --self-check

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "RI-${{ github.event.release.tag_name }}-windows-x86_64"
          $zip = Join-Path (Get-Location) "dist/$name.zip"
          Compress-Archive -Path target\release\ide-app.exe -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $name.zip" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*

  linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            fonts-dejavu-core

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build -p ide-app --release

      - name: Self-check the release binary
        run: ./target/release/ide-app --self-check

      - name: Package
        run: |
          mkdir -p dist stage
          name="RI-${{ github.event.release.tag_name }}-linux-x86_64"
          cp target/release/ide-app stage/ide-app
          chmod +x stage/ide-app
          ./target/release/ide-app --export-icon stage/rust-ai-ide.png
          cat > stage/rust-ai-ide.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Rust AI IDE
          Comment=JetBrains IntelliJ IDEA Islands UI in Pure Rust
          Exec=ide-app %F
          Icon=rust-ai-ide
          Terminal=false
          Categories=Development;IDE;
          EOF
          tar -C stage -czf "dist/$name.tar.gz" ide-app rust-ai-ide.png rust-ai-ide.desktop
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*

  macos:
    name: Build macOS (${{ matrix.arch_label }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: arm64
            run_tests: true
          - target: x86_64-apple-darwin
            arch_label: x86_64
            run_tests: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        if: ${{ matrix.run_tests }}
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p ide-app --release --target ${{ matrix.target }}

      - name: Self-check the release binary
        if: ${{ matrix.run_tests }}
        run: ./target/${{ matrix.target }}/release/ide-app --self-check

      - name: Package macOS .app bundle
        run: |
          mkdir -p dist "stage/Rust AI IDE.app/Contents/MacOS" "stage/Rust AI IDE.app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/ide-app" "stage/Rust AI IDE.app/Contents/MacOS/ide-app"
          chmod +x "stage/Rust AI IDE.app/Contents/MacOS/ide-app"

          cat > "stage/Rust AI IDE.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Rust AI IDE</string>
            <key>CFBundleExecutable</key>
            <string>ide-app</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>dev.rustaiide.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Rust AI IDE</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Generate AppIcon.icns using native runner binary if possible
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "./target/${{ matrix.target }}/release/ide-app" --export-icon stage/ri_256.png
          else
            cargo run -p ide-app -- --export-icon stage/ri_256.png
          fi
          mkdir -p stage/AppIcon.iconset
          sips -z 16 16     stage/ri_256.png --out stage/AppIcon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     stage/ri_256.png --out stage/AppIcon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     stage/ri_256.png --out stage/AppIcon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     stage/ri_256.png --out stage/AppIcon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   stage/ri_256.png --out stage/AppIcon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256   stage/ri_256.png --out stage/AppIcon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   stage/ri_256.png --out stage/AppIcon.iconset/icon_256x256.png >/dev/null
          cp stage/ri_256.png stage/AppIcon.iconset/icon_256x256@2x.png
          iconutil -c icns stage/AppIcon.iconset -o "stage/Rust AI IDE.app/Contents/Resources/AppIcon.icns"

          name="RI-${{ github.event.release.tag_name }}-macos-${{ matrix.arch_label }}"
          ditto -c -k --sequesterRsrc --keepParent "stage/Rust AI IDE.app" "dist/$name.zip"
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch_label }}
          path: dist/*

  publish:
    name: Publish GitHub Release Assets
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: artifacts/*
